  const out = {};
  Object.entries(cb).forEach(([cc, sides]) => {

// ─── ROBUST COLUMN DETECTION ─────────────────────────────────────────────────
// Strategy: 1) Try header keywords (fast, reliable)  2) Fall back to data-pattern analysis

function findCol(headerRow, keywords) {
  if (!headerRow) return -1;
  for (const kw of keywords) {
    const kwl = kw.toLowerCase();
    for (let c = 0; c < headerRow.length; c++) {
      const h = String(headerRow[c] || '').toLowerCase().trim();
      if (h === kwl || h.includes(kwl)) return c;
    }
  }
  return -1;
}

function findHeaderRow(rows, expectedKeywords, maxScan = 10) {
  let bestRow = -1, bestScore = 0;
  for (let i = 0; i < Math.min(rows.length, maxScan); i++) {
    const row = rows[i]; if (!row) continue;
    const rowStr = row.map(v => String(v || '').toLowerCase().trim());
    let score = 0;
    for (const kw of expectedKeywords) {
      if (rowStr.some(s => s.includes(kw.toLowerCase()))) score++;
    }
    if (score > bestScore) { bestScore = score; bestRow = i; }
  }
  return bestScore >= 2 ? bestRow : -1;
}

// ─── DATA PATTERN DETECTORS ──────────────────────────────────────────────────
// Sample up to N data rows from a column and score how well they match a pattern

function sampleCol(rows, col, dataStart, n = 40) {
  const vals = [];
  for (let i = dataStart; i < Math.min(rows.length, dataStart + n); i++) {
    if (rows[i] && rows[i][col] != null && rows[i][col] !== '') vals.push(rows[i][col]);
  }
  return vals;
}

function isDateVal(v) {
  if (v instanceof Date) return true;
  if (typeof v === 'number' && v > 40000 && v < 50000) return true; // Excel serial
  const s = String(v).trim();
  return /^\d{1,2}\.\d{1,2}\.\d{4}/.test(s) || /^\d{4}-\d{1,2}-\d{1,2}/.test(s);
}

function isCostCenter(v) {
  const n = typeof v === 'number' ? v : parseInt(String(v).trim(), 10);
  return !isNaN(n) && n >= 300000 && n <= 399999;
}

function isKostLike(v) {
  // KOST1 can be plain CC number or "375793 - MM - Name" format
  const s = String(v).trim();
  const m = s.match(/^(\d+)/);
  if (!m) return false;
  const n = parseInt(m[1], 10);
  return n >= 300000 && n <= 399999;
}

function isAmountVal(v) {
  if (typeof v === 'number') return Math.abs(v) > 0.001 && Math.abs(v) < 1e9;
  const s = String(v).trim().replace(/[€$£\s]/g, '');
  return /^-?[\d.,]+$/.test(s) && s.length > 1;
}

function isCurrencyVal(v) {
  const s = String(v).trim().toUpperCase();
  return ['EUR', 'USD', 'GBP', 'CHF', 'SEK', 'DKK', 'NOK', 'PLN', 'CZK'].includes(s) || s.length === 3 && /^[A-Z]{3}$/.test(s);
}

function isTaxRate(v) {
  const n = typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.'));
  return !isNaN(n) && n >= 0 && n <= 30 && (n === 0 || n === 7 || n === 19 || n === 5 || n === 16 || n === 20 || n === 21 || n === 25);
}

function isStatusLike(v) {
  const s = String(v).trim().toLowerCase();
  return ['exportiert', 'ausstehend', 'exported', 'pending', 'approved', 'paid', 'open', 'closed', 'draft', 'freigegeben', 'gebucht'].some(k => s.includes(k)) || s.length < 20;
}

function isInvoiceNo(v) {
  const s = String(v).trim();
  return s.length >= 2 && s.length <= 30 && /[0-9]/.test(s);
}

function isTextVal(v) {
  const s = String(v).trim();
  return s.length > 3 && /[a-zA-ZäöüÄÖÜß]/.test(s);
}

// Score a column for a given pattern detector, return 0..1
function scoreCol(rows, col, dataStart, detector, n = 40) {
  const vals = sampleCol(rows, col, dataStart, n);
  if (vals.length === 0) return 0;
  const matches = vals.filter(detector).length;
  return matches / vals.length;
}

// Find best column for a role using: header keywords (priority) + data pattern (fallback)
// exclude: set of already-assigned column indices to avoid double-assignment
function detectCol(rows, headerRow, dataStart, keywords, patternFn, exclude = new Set(), minScore = 0.5) {
  // Try header keywords first
  const byHeader = findCol(headerRow, keywords);
  if (byHeader >= 0 && !exclude.has(byHeader)) return byHeader;

  // Fall back to data pattern
  if (!patternFn) return byHeader >= 0 ? byHeader : -1;
  let bestCol = -1, bestScore = 0;
  const numCols = rows[dataStart]?.length || 0;
  for (let c = 0; c < numCols; c++) {
    if (exclude.has(c)) continue;
    const sc = scoreCol(rows, c, dataStart, patternFn);
    if (sc > bestScore && sc >= minScore) { bestScore = sc; bestCol = c; }
  }
  return bestCol;
}

    } else if (raw) {
      const s = String(raw).trim(); dl = s;
      const dm = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);
      if (dm) { m = +dm[2]; y = +dm[3]; }
      else { const iso = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (iso) { m = +iso[2]; y = +iso[1]; } }
    }
    if (m !== fM || y !== fY) continue;

    const { cc, project } = parseKOST1(r[cKost]);
    if (!cc || cc < 300000 || cc > 399999) continue;
    const gross = parseGermanNum(cAmount >= 0 ? r[cAmount] : 0);
    const tax = cTax >= 0 ? (typeof r[cTax] === 'number' ? r[cTax] : parseFloat(String(r[cTax]).replace(',', '.')) || 0) : 0;
    const net = tax > 0 ? gross / (1 + tax / 100) : gross;
    if (!map.has(cc)) map.set(cc, { net: 0, gross: 0, count: 0, bills: [], project });
    const d = map.get(cc);
    d.net += net; d.gross += gross; d.count++;
    d.bills.push({
      billNo: String(cBillNo >= 0 ? r[cBillNo] || '—' : '—'),
      vendor: String(cVendor >= 0 ? r[cVendor] || '—' : '—'),
      date: dl, gross, tax, net,
      currency: String(cCurrency >= 0 ? r[cCurrency] || 'EUR' : 'EUR'),
      status: String(cStatus >= 0 ? r[cStatus] || '—' : '—')
    });
  }
  return map;
}

function parseDATEV(rows, accMap, fM, fY) {
  const map = new Map();
  if (!rows || !rows.length) return map;
  const expC = new Set(['EXPENSES [COGS]', 'EXPENSES [OTHER]']);

  // Find first column-header row (contains "Datum")
  let colMap = null;
  for (let i = 0; i < Math.min(rows.length, 20); i++) {
    const row = rows[i]; if (!row) continue;
    const r0 = String(row[0] || '').trim();
    // Check if this row looks like a header row
    const rowStrs = row.map(v => String(v || '').toLowerCase().trim());
    if (r0 === 'Datum' || rowStrs.includes('datum')) {
      const h = row;
      const used = new Set();
      const cDatum = findCol(h, ['datum', 'date']); if (cDatum >= 0) used.add(cDatum);
      const cText = detectCol(rows, h, i + 1, ['buchungstext', 'text', 'description', 'bezeichnung', 'beschreibung'], null, used); if (cText >= 0) used.add(cText);
      const cBeleg = detectCol(rows, h, i + 1, ['belegfeld1', 'belegfeld', 'beleg', 'doc ref', 'belegnr', 'beleg-nr', 'document'], null, used); if (cBeleg >= 0) used.add(cBeleg);
      const cSoll = detectCol(rows, h, i + 1, ['umsatz soll', 'soll', 'debit', 'soll-betrag'], null, used); if (cSoll >= 0) used.add(cSoll);
      const cHaben = detectCol(rows, h, i + 1, ['umsatz haben', 'haben', 'credit', 'haben-betrag'], null, used); if (cHaben >= 0) used.add(cHaben);
      const cWkz = detectCol(rows, h, i + 1, ['wkz', 'währung', 'currency', 'devise'], null, used); if (cWkz >= 0) used.add(cWkz);
      const cKost = detectCol(rows, h, i + 1, ['kost1', 'kost', 'kostenstelle', 'cost center'], null, used);
      colMap = { datum: cDatum >= 0 ? cDatum : 0, buchungstext: cText, belegfeld: cBeleg, soll: cSoll >= 0 ? cSoll : 8, haben: cHaben >= 0 ? cHaben : 9, wkz: cWkz, kost1: cKost >= 0 ? cKost : 11 };
      break;
    }
  }
  if (!colMap) colMap = { datum: 0, buchungstext: 5, belegfeld: 7, soll: 8, haben: 9, wkz: 10, kost1: 11 };

  let cur = null;
  for (const row of rows) {
    const c0 = row[colMap.datum] ? String(row[colMap.datum]) : (row[0] ? String(row[0]) : '');
    if (!c0) continue;
    if (c0.includes('Kanzlei') || c0.includes('Jahreskonto')) { const m2 = c0.match(/Jahreskonto\s+(\d+)/); if (m2) cur = +m2[1]; continue; }
    if (c0 === 'Datum' || c0 === 'Column1') continue;
    if (cur === null) continue;
    const cat = accMap.get(cur);
    if (!cat || !expC.has(cat)) continue;
    const dt = extractDate(row[colMap.datum]);
    if (!dt || dt.m !== fM || dt.y !== fY) continue;
    const k1 = colMap.kost1 >= 0 && row[colMap.kost1] ? String(row[colMap.kost1]).trim() : '';
    if (!k1) continue;
    const m3 = k1.match(/^(\d+)/);
    if (!m3) continue;
    const cc = +m3[1];
    if (cc < 300000 || cc > 399999) continue;
    const soll = typeof row[colMap.soll] === 'number' ? row[colMap.soll] : parseGermanNum(row[colMap.soll]);
    const haben = typeof row[colMap.haben] === 'number' ? row[colMap.haben] : parseGermanNum(row[colMap.haben]);
    const net = soll - haben;
    if (!map.has(cc)) map.set(cc, { total: 0, entries: [] });
    const d = map.get(cc);
    d.total += net;
    d.entries.push({
      date: String(row[colMap.datum] || c0), accCode: cur, accCat: cat,
      belegfeld: String(colMap.belegfeld >= 0 ? row[colMap.belegfeld] || '—' : '—'),
      text: String(colMap.buchungstext >= 0 ? row[colMap.buchungstext] || '—' : '—'),
      net, currency: String(colMap.wkz >= 0 ? row[colMap.wkz] || 'EUR' : 'EUR')
    });
  }
  return map;
}

function parseCDH(rows, fM, fY) {
  const map = new Map();
  if (!rows || rows.length < 3) return map;

  const hdrIdx = findHeaderRow(rows, ['rg-datum', 'komm-nr', 'nettobetrag', 'deck', 'datum', 'invoice', 'net', 'cc', 'customer', 'kunde'], 8);
  const hdr = rows[hdrIdx >= 0 ? hdrIdx : 2];
  const ds = (hdrIdx >= 0 ? hdrIdx : 2) + 1;
  const used = new Set();

  // Detect columns
  const cDate = detectCol(rows, hdr, ds, ['rg-datum', 'datum', 'invoice date', 'date', 'rechnungsdatum'], isDateVal, used); if (cDate >= 0) used.add(cDate);
  const cInvNo = detectCol(rows, hdr, ds, ['rg-nr', 'rg-nr.', 'rechnungsnr', 'invoice no', 'invoice', 'beleg', 'belegnr'], isInvoiceNo, used, 0.3); if (cInvNo >= 0) used.add(cInvNo);
  const cCC = detectCol(rows, hdr, ds, ['komm-nr', 'komm-nr.', 'kommissionsnr', 'kostenstelle', 'cost center', 'cc', 'kost'], v => { const n = typeof v === 'number' ? v : parseInt(String(v), 10); return !isNaN(n) && n >= 100000 && n <= 999999; }, used); if (cCC >= 0) used.add(cCC);
  const cCustomer = detectCol(rows, hdr, ds, ['kunde', 'customer', 'kundenname', 'client', 'name', 'käufer'], isTextVal, used, 0.3); if (cCustomer >= 0) used.add(cCustomer);
  const cArtikel = detectCol(rows, hdr, ds, ['artikelbezeichnung', 'artikel', 'article', 'product', 'beschreibung', 'item', 'ware', 'produkt'], isTextVal, used, 0.2); if (cArtikel >= 0) used.add(cArtikel);

  // For Netto and DB: we need two amount columns. Detect all amount-like columns, then pick the best two.
  const cNetto = detectCol(rows, hdr, ds, ['nettobetrag', 'netto', 'net amount', 'net', 'umsatz', 'revenue', 'sales'], v => isAmountVal(v) && (typeof v === 'number' ? Math.abs(v) > 1 : true), used, 0.3); if (cNetto >= 0) used.add(cNetto);
  const cDB = detectCol(rows, hdr, ds, ['deck.-beitrag', 'deckungsbeitrag', 'deck', 'db', 'contribution', 'margin', 'profit', 'beitrag', 'ertrag'], v => isAmountVal(v), used, 0.3);

  if (cCC < 0 || cNetto < 0) return map;

  // Determine fill-down columns
  const fillCols = [cDate, cInvNo, cCC, cCustomer].filter(c => c >= 0);
  const maxFill = fillCols.length ? Math.max(...fillCols) + 1 : 5;
  let fd = new Array(Math.max(maxFill, (rows[ds]?.length || 0))).fill(null);

  for (let i = ds; i < rows.length; i++) {
    const r = [...(rows[i] || [])];
    if (!r.length || r.every(v => v == null)) continue;
    for (let c = 0; c < maxFill && c < r.length; c++) {
      if (r[c] != null) fd[c] = r[c]; else r[c] = fd[c];
    }
    const rg = cDate >= 0 && r[cDate] ? String(r[cDate]).trim() : '';
    const rn = cInvNo >= 0 && r[cInvNo] ? String(r[cInvNo]).trim() : '';
    if (rg === 'Summe' || rn === 'Summe') continue;
    const dt = extractDate(cDate >= 0 ? r[cDate] : null);
    if (!dt || dt.m !== fM || dt.y !== fY) continue;
    const cc = cCC >= 0 && r[cCC] ? parseInt(String(r[cCC]), 10) : null;
    if (!cc || isNaN(cc)) continue;
    const netto = typeof r[cNetto] === 'number' ? r[cNetto] : parseGermanNum(r[cNetto]);
    const db = cDB >= 0 ? (typeof r[cDB] === 'number' ? r[cDB] : parseGermanNum(r[cDB])) : 0;
    if (!map.has(cc)) map.set(cc, { cogs: 0, netto: 0, db: 0, lines: [] });
    const d = map.get(cc);
    d.cogs += netto - db; d.netto += netto; d.db += db;
    d.lines.push({
      invoiceNo: String(cInvNo >= 0 ? r[cInvNo] || '—' : '—'),
      customer: String(cCustomer >= 0 ? r[cCustomer] || '—' : '—'),
      date: rg,
      artikel: String(cArtikel >= 0 ? r[cArtikel] || '—' : '—'),
      netto, db, cogs: netto - db
    });
  }
  return map;
}

function parseOpening(rows) {
  const map = new Map();
  if (!rows || rows.length < 2) return map;

  const hdrIdx = findHeaderRow(rows, ['cost centre', 'kostenstelle', 'closing', 'inventory', 'cc', 'bestand', 'value', 'cost center'], 10);
  const hdr = hdrIdx >= 0 ? rows[hdrIdx] : null;
  const ds = hdrIdx >= 0 ? hdrIdx + 1 : 3;
  const used = new Set();

  const cCC = hdr ? detectCol(rows, hdr, ds, ['cost centre', 'cost center', 'kostenstelle', 'cc', 'komm-nr', 'komm', 'projekt-nr', 'center'], isCostCenter, used) : -1; if (cCC >= 0) used.add(cCC);
  const cVal = hdr ? detectCol(rows, hdr, ds, ['final_closing', 'closing inventory', 'closing', 'inventory', 'bestand', 'endbestand', 'value', 'amount', 'saldo', 'balance', 'wert'], v => typeof v === 'number' && Math.abs(v) > 0, used, 0.3) : -1;

  // Fallbacks
  const fCC = cCC >= 0 ? cCC : 1;
  const fVal = cVal >= 0 ? cVal : 7;

  for (let i = ds; i < rows.length; i++) {
    const r = rows[i]; if (!r) continue;
    const cc = r[fCC], val = r[fVal];
    if (cc == null) continue;
    const ccN = Math.round(typeof cc === 'number' ? cc : parseFloat(String(cc)));
    if (isNaN(ccN) || ccN <= 0) continue;
    // Skip if it's clearly a header/text row
    if (typeof cc === 'string' && !/^\d+$/.test(cc.trim())) continue;
    map.set(ccN, typeof val === 'number' ? val : parseGermanNum(val));
  }
  return map;
}

function buildSheet(LIB, title, period, headers, dataRows, totalRow, colWidths, opts = {}) {
  const numCols = headers.length;
  const allData = [
    ['fresh id Products Berlin'],
    [title + (period ? ' — ' + period : '')],
    ['Generated: ' + new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' })],
    [],
    headers,
    ...dataRows,
  ];
  if (totalRow) allData.push(totalRow);
  const ws = LIB.utils.aoa_to_sheet(allData);
  ws['!cols'] = colWidths.map(w => ({ wch: w }));
  ws['!merges'] = [
    { s: { r: 0, c: 0 }, e: { r: 0, c: numCols - 1 } },
    { s: { r: 1, c: 0 }, e: { r: 1, c: numCols - 1 } },
    { s: { r: 2, c: 0 }, e: { r: 2, c: numCols - 1 } },
  ];
  ws['!rows'] = [{ hpt: 30 }, { hpt: 24 }, { hpt: 18 }, { hpt: 6 }, { hpt: 26 }];
  // Apply styles
  for (let c = 0; c < numCols; c++) {
    sc(ws, LIB.utils.encode_cell({ r: 0, c }), c === 0 ? allData[0][0] : '', c === 0 ? XS.title : XS.blank);
    sc(ws, LIB.utils.encode_cell({ r: 1, c }), c === 0 ? allData[1][0] : '', c === 0 ? XS.subtitle : XS.blankSub);
    sc(ws, LIB.utils.encode_cell({ r: 2, c }), c === 0 ? allData[2][0] : '', c === 0 ? XS.date : XS.blankDate);
    sc(ws, LIB.utils.encode_cell({ r: 4, c }), headers[c], XS.hdr);
  }
  const statusColIdx = opts.statusCol ?? -1;
  for (let ri = 0; ri < dataRows.length; ri++) {
    const row = dataRows[ri]; const isAlt = ri % 2 === 1; const rIdx = 5 + ri;
    for (let c = 0; c < numCols; c++) {
      const ref = LIB.utils.encode_cell({ r: rIdx, c }); const val = row[c];
      if (c === statusColIdx && typeof val === 'string') {
        const sl = val.toLowerCase();
        sc(ws, ref, val, sl === 'match' ? XS.match : sl === 'minor' ? XS.minor : sl.includes('vari') ? XS.variance : (isAlt ? XS.da : XS.d));
      } else if (typeof val === 'number') { sc(ws, ref, val, isAlt ? XS.dna : XS.dn);
      } else { sc(ws, ref, val ?? '', isAlt ? XS.da : XS.d); }
    }
  }
  if (totalRow) {
    const tIdx = 5 + dataRows.length;
    for (let c = 0; c < numCols; c++) {
      const ref = LIB.utils.encode_cell({ r: tIdx, c }); const val = totalRow[c];
      sc(ws, ref, typeof val === 'number' ? val : val ?? '', typeof val === 'number' ? XS.totn : XS.tot);
    }
  }
  return ws;
}

async function exportWorkbook(sheets, filename) {
  const LIB = await loadXlsxStyle();
  const wb = LIB.utils.book_new();
  sheets.forEach(s => {
    const ws = buildSheet(LIB, s.title, s.period, s.headers, s.dataRows, s.totalRow, s.colWidths, s.opts || {});
    LIB.utils.book_append_sheet(wb, ws, s.name);
  });
  LIB.writeFile(wb, filename);
}

// ─── AUTO-DETECT FILE TYPE ──────────────────────────────────────────────────
function detectFileType(data) {
  if (!data || data.length < 2) return null;
  // Scan first 15 rows for signature patterns
  const sample = data.slice(0, 15);
  const allText = sample.map(r => (r||[]).map(c => String(c||'').toLowerCase()).join(' ')).join(' ');

  // DATEV: Contains "jahreskonto" or "kanzlei" in section headers
  if (allText.includes('jahreskonto') || allText.includes('kanzlei')) return 'datev';

  // CDH: Has columns like rg-datum, komm-nr, nettobetrag, deck
  const cdhKw = ['rg-datum','komm-nr','nettobetrag','deck.-beitrag','deck','komm'];
  const cdhHits = cdhKw.filter(k => allText.includes(k)).length;
  if (cdhHits >= 2) return 'cdh';

  // Candis: Has columns like rechnungsnummer, geschäftspartner, betrag, kost1
  const candisKw = ['rechnungsnummer','geschäftspartner','betrag','kost1','rechnungsdatum','steuer'];
  const candisHits = candisKw.filter(k => allText.includes(k)).length;
  if (candisHits >= 2) return 'candis';

  // Opening: Has cost centre / closing / inventory / bestand
  const openKw = ['cost centre','cost center','kostenstelle','closing','inventory','bestand','endbestand','final_closing'];
  const openHits = openKw.filter(k => allText.includes(k)).length;
  if (openHits >= 1) return 'opening';

  // Fallback: try data pattern detection
  // If many rows have 6-digit numbers in 300k-399k range in column 1-2, likely opening
  let ccCount = 0;
  for (let i = 2; i < Math.min(data.length, 30); i++) {
    const r = data[i];
    if (!r) continue;
    for (let c = 0; c < Math.min(3, r.length); c++) {
      const n = typeof r[c] === 'number' ? r[c] : parseInt(String(r[c]), 10);
      if (n >= 300000 && n <= 399999) ccCount++;
    }
  }
  if (ccCount > 5) return 'opening';

  return null;
}

const handleFolderUpload = useCallback((e) => {
  const fileList = e.target.files;
  if (!fileList || !fileList.length) return;
  const xlsFiles = [...fileList].filter(f => /\.(xlsx|xls|csv)$/i.test(f.name));
  if (!xlsFiles.length) { addToast('No Excel/CSV files found in folder', 'error'); return; }

  let processed = 0;
  const results = {};
  xlsFiles.forEach(f => {
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const wb = window.XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const data = window.XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
        const type = detectFileType(data);
        if (type && !results[type]) {
          results[type] = { data, name: f.name, rows: data.length };
        }
      } catch (err) { /* skip unreadable files */ }
      processed++;
      if (processed === xlsFiles.length) {
        // Apply detected files
        let count = 0;
        Object.entries(results).forEach(([type, { data, name, rows }]) => {
          setFiles(p => ({ ...p, [type]: data }));
          setFileNames(p => ({ ...p, [type]: `✓ ${name} · ${rows} rows (auto)` }));
          count++;
        });
        if (count) addToast(`Auto-detected ${count} file${count>1?'s':''}: ${Object.keys(results).join(', ')}`, 'success');
        const missed = ['candis','datev','cdh','opening'].filter(k => !results[k]);
        if (missed.length) addToast(`Could not auto-detect: ${missed.join(', ')} — upload manually`, 'info');
      }
    };
    reader.readAsArrayBuffer(f);
  });
  e.target.value = '';
}, [addToast]);
