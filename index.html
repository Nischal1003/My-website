<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nischal Adhikari</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      height: 80px;
      align-self: flex-start;
    }

    .content {
      max-width: 800px;
      text-align: center;
      margin-top: 30px;
    }

    .intro {
      color: royalblue;
      font-size: 1.2rem;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .message {
      color: black;
      font-size: 1rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <img src="nlogo.png" alt="Nischal Logo" class="logo" />

  <div class="content">
    <p class="intro">
      Hi, this is Nischal. No clients, no deadlines – just me having fun with data and ideas.
    </p>
    <p class="message">
      I am currently developing some projects which will get published soon here. See ya till then.
    </p>
  </div>
</body>
</html>
