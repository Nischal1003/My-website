<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard Page</title>
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%;
      font-family: Arial, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      background-color: #f5f5f5;
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      box-shadow: 0 2px 4px rgb(0 0 0 / 0.1);
      z-index: 1000;
    }
    header img {
      height: 40px;
      width: auto;
    }
    main {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      padding-top: 60px; /* space for fixed header */
      box-sizing: border-box;
      background-color: #fff;
    }
    iframe {
      border: none;
      max-width: 100%;
      height: 373.5px;
      width: 600px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border-radius: 4px;
    }
    @media (max-width: 640px) {
      iframe {
        width: 100%;
        height: auto;
        aspect-ratio: 600 / 373.5;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo" />
  </header>
  <main>
    <iframe
      title="Nischal V Pravesh Scoreboard"
      src="https://app.powerbi.com/view?r=eyJrIjoiODJiMTA1MzQtZjJkNi00NTU2LTg3YmUtMTljZDRhYmQyMjMzIiwidCI6ImZlODg0M2Q0LTk1ODAtNGYyMi04NGNmLTI1MjFhMjNlMjhkZCJ9"
      allowfullscreen="true"
      ></iframe>
  </main>
</body>
</html>
