<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAGN Product Matcher</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F0F2F5;--surface:#FFFFFF;--surface2:#F7F8FA;--border:#E3E6EB;--border2:#CDD1D9;--text:#0D1117;--text2:#3D4452;--muted:#6B7385;--muted2:#9BA3B2;--brand:#0A0F1E;--accent:#2563EB;--green:#16A34A;--green-l:#F0FDF4;--amber:#D97706;--amber-l:#FFFBEB;--orange:#EA580C;--orange-l:#FFF7ED;--red:#DC2626;--red-l:#FEF2F2;--blue:#2563EB;--blue-l:#EFF6FF;--shadow-sm:0 1px 2px rgba(0,0,0,0.04);--shadow-md:0 4px 12px rgba(0,0,0,0.07);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:13.5px;line-height:1.5;min-height:100vh;}
.mh{background:linear-gradient(135deg,#1B2A4A,#0F1B33);border-bottom:3px solid #D4A843;}
.mht{background:#D4A843;padding:4px 20px;text-align:center;}
.mht span{font-size:10px;font-weight:600;color:#0F1B33;letter-spacing:1px;text-transform:uppercase;}
.mhm{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.mhb{display:flex;align-items:center;gap:14px;}
.mhl{width:42px;height:42px;background:#D4A843;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#0F1B33;}
.mhtt{font-size:20px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:0.5px;}
.mhtt span{color:#D4A843;}
.ctn{padding:22px;max-width:1300px;margin:0 auto;}
.btn{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:12.5px;font-weight:600;transition:all 0.15s;font-family:'Inter',sans-serif;}
.btn-gold{background:#D4A843;color:#0F1B33;}.btn-gold:hover{background:#E8BF5A;}
.btn-gold:disabled{background:#D1D5DB;color:#9CA3B2;cursor:wait;}
.btn-big{padding:12px 36px;font-size:14px;border-radius:10px;}
.btn-out{background:var(--blue-l);color:var(--blue);border:1px solid rgba(37,99,235,0.2);}
.btn-ghost{background:var(--surface);color:var(--text2);border:1px solid var(--border2);}
.btn-danger{background:var(--red-l);color:var(--red);border:1px solid rgba(220,38,38,0.2);}
.center{text-align:center;}

/* ═══ VENDOR SELECTOR ═══ */
.vs{max-width:600px;margin:40px auto;text-align:center;}
.vs-title{font-size:22px;font-weight:700;margin-bottom:4px;}
.vs-sub{font-size:13px;color:var(--muted);margin-bottom:28px;}
.vs-list{display:flex;flex-direction:column;gap:8px;margin-bottom:24px;text-align:left;}
.vs-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:14px;}
.vs-card:hover{border-color:var(--accent);box-shadow:var(--shadow-md);transform:translateY(-1px);}
.vs-av{width:42px;height:42px;background:#D4A843;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#0F1B33;flex-shrink:0;}
.vs-info{flex:1;min-width:0;}
.vs-name{font-size:15px;font-weight:600;}
.vs-meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:12px;}
.vs-meta b{color:var(--text2);font-weight:600;}
.vs-arrow{color:var(--muted2);font-size:18px;flex-shrink:0;}
.vs-del{padding:6px;border-radius:6px;border:none;cursor:pointer;background:transparent;color:var(--muted2);transition:all 0.12s;flex-shrink:0;}
.vs-del:hover{background:var(--red-l);color:var(--red);}
.vs-empty{color:var(--muted);font-size:13px;padding:20px;background:var(--surface);border:1px dashed var(--border2);border-radius:12px;margin-bottom:24px;}
.vs-divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted2);font-size:12px;}
.vs-divider::before,.vs-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.vs-new{display:flex;gap:10px;align-items:center;}
.vs-input{flex:1;padding:11px 16px;border-radius:10px;border:1.5px solid var(--border2);background:var(--surface);color:var(--text);font-size:14px;font-weight:600;outline:none;font-family:'Inter',sans-serif;}
.vs-input:focus{border-color:#D4A843;}
.vs-input::placeholder{color:var(--muted2);font-weight:400;}
.sync-ind{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;}
.sync-ok{background:var(--green-l);color:var(--green);}
.sync-ing{background:var(--amber-l);color:var(--amber);}
.sync-err{background:var(--red-l);color:var(--red);}
.sync-dot{width:6px;height:6px;border-radius:50%;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* ═══ MAIN UI ═══ */
.uploads{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
.uz{flex:1;min-width:260px;padding:36px 20px;border-radius:12px;cursor:pointer;border:2px dashed var(--border2);background:var(--surface);transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:var(--shadow-sm);}
.uz:hover{border-color:#D4A843;box-shadow:var(--shadow-md);}
.uz.done{border-color:var(--green);border-style:solid;background:var(--green-l);}
.uz .ui{font-size:38px;}.uz .ul{font-size:14px;font-weight:700;}.uz.done .ul{color:var(--green);}
.uz .us{font-size:12px;color:var(--muted);text-align:center;}.uz input{display:none;}
.rtxt{font-size:14px;color:var(--muted);margin-bottom:14px;}.rtxt b{color:var(--brand);}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin-bottom:20px;}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:12px 12px 0 0;}
.sc.sg::before{background:var(--green);}.sc.sr::before{background:var(--red);}.sc.so::before{background:var(--orange);}.sc.sy::before{background:var(--amber);}.sc.sn::before{background:var(--brand);}
.scl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;}
.scv{font-size:30px;font-weight:700;line-height:1;}.scs{font-size:11px;color:var(--muted);margin-top:6px;}
.dvd{height:1px;background:var(--border);margin:20px 0;}
.cbar{display:flex;gap:18px;margin-bottom:14px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--surface);border-radius:10px;border:1px solid var(--border);}
.ci{display:flex;align-items:center;gap:6px;}.cd{width:9px;height:9px;border-radius:50%;}
.cd.ch{background:var(--green);}.cd.cm{background:var(--amber);}.cd.cl{background:var(--orange);}.cd.cn{background:var(--red);}
.ct{font-size:13px;color:var(--muted);}.ct b{color:var(--text);margin-left:3px;}
.tbar{display:flex;gap:6px;margin-bottom:14px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--surface);border-radius:10px;border:1px solid var(--border);}
.tab{padding:7px 16px;border-radius:7px;border:none;font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:var(--muted);transition:all 0.12s;}
.tab:hover{color:var(--text);background:var(--surface2);}.tab.act{background:var(--brand);color:#fff;}
.tbar select,.tbar input[type="text"],.tbar input[type="search"]{padding:7px 11px;border-radius:7px;border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:12px;outline:none;font-family:'Inter',sans-serif;}
.tbar input[type="text"],.tbar input[type="search"]{width:170px;}.tbar input:focus,.tbar select:focus{border-color:var(--accent);}
.tbar input::placeholder{color:var(--muted2);}.spacer{flex:1;}
.mr{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;overflow:hidden;transition:box-shadow 0.15s;}
.mr:hover{box-shadow:var(--shadow-md);}
.mrh{padding:12px 18px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background 0.1s;}
.mrh:hover{background:var(--surface2);}
.mrn2{font-size:11px;color:var(--muted2);width:30px;flex-shrink:0;font-weight:500;}
.mri{flex:1;min-width:0;}.mri .mn{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mri .mm{font-size:11px;color:var(--muted);margin-top:2px;}
.mra{font-size:14px;color:var(--muted2);flex-shrink:0;}
.mrb{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.badge{display:inline-flex;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:0.3px;text-transform:uppercase;}
.bg{background:var(--green-l);color:var(--green);border:1px solid rgba(22,163,74,0.2);}
.by{background:var(--amber-l);color:var(--amber);border:1px solid rgba(217,119,6,0.2);}
.bo{background:var(--orange-l);color:var(--orange);border:1px solid rgba(234,88,12,0.2);}
.br{background:var(--red-l);color:var(--red);border:1px solid rgba(220,38,38,0.2);}
.bb{background:var(--blue-l);color:var(--blue);border:1px solid rgba(37,99,235,0.2);}
.mrs{font-size:12px;color:var(--muted);width:30px;text-align:right;font-weight:600;}
.mrx{font-size:12px;color:var(--muted2);transition:transform 0.15s;display:inline-block;}
.bh{border-left:4px solid var(--green);}.bm{border-left:4px solid var(--amber);}.bl{border-left:4px solid var(--orange);}.bn{border-left:4px solid var(--red);}
.mrd{padding:0 18px 18px;border-top:1px solid var(--border);display:none;background:var(--surface2);}
.dc{display:flex;gap:14px;margin-top:14px;}
.dcol{flex:1;background:var(--surface);border-radius:10px;padding:16px;border:1px solid var(--border);}
.dcol h4{font-size:11px;text-transform:uppercase;letter-spacing:0.7px;margin-bottom:12px;font-weight:700;padding-bottom:8px;border-bottom:2px solid var(--border);}
.dcol h4.dns{color:var(--accent);}.dcol h4.dsp{color:var(--green);}
.dr{display:flex;font-size:12px;margin-bottom:5px;line-height:1.5;}
.dr .dk{color:var(--muted);width:65px;flex-shrink:0;font-weight:600;text-transform:uppercase;font-size:10px;}
.dr .dv{color:var(--text);word-break:break-word;}
.dd{font-size:11.5px;color:var(--text2);margin-top:10px;line-height:1.6;max-height:55px;overflow:auto;padding-top:8px;border-top:1px solid var(--border);}
.sb{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
.sig{font-size:11px;padding:4px 10px;border-radius:6px;font-weight:500;background:var(--blue-l);color:var(--blue);border:1px solid rgba(37,99,235,0.15);}
.sigw{background:var(--red-l);color:var(--red);border:1px solid rgba(220,38,38,0.15);}
.ab{margin-top:12px;display:flex;gap:6px;}
.pk{margin-top:8px;background:var(--surface);border-radius:10px;padding:10px;max-height:220px;overflow:auto;border:1px solid var(--border);display:none;box-shadow:0 6px 20px rgba(0,0,0,0.1);}
.pk input{width:100%;padding:8px 12px;border-radius:7px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:12px;margin-bottom:6px;outline:none;}
.pki{padding:9px 12px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--text);transition:background 0.1s;margin-bottom:2px;}
.pki:hover{background:var(--blue-l);}.pki b{font-weight:600;}.pki small{font-size:11px;color:var(--muted);}
.us{margin-top:24px;}.us h3{font-size:14px;font-weight:600;color:var(--orange);margin-bottom:10px;}
.ut{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.uth{display:grid;grid-template-columns:170px 1fr 100px 70px;padding:10px 16px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border);font-weight:600;background:var(--surface2);}
.utb{max-height:350px;overflow:auto;}
.utr{display:grid;grid-template-columns:170px 1fr 100px 70px;padding:9px 16px;font-size:12px;border-bottom:1px solid var(--border);color:var(--text);}
.utr:hover{background:var(--surface2);}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:13px;}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px;}
</style>
</head>
<body>
<div class="mh">
<div class="mht"><span id="htag">MAGN · Product Matcher</span></div>
<div class="mhm">
<div class="mhb"><div class="mhl">M</div><div class="mhtt"><span>MAGN</span> Product Matcher</div></div>
<div style="display:flex;gap:8px;align-items:center;">
<div id="sync-el"></div>
<div id="exp-wrap" style="display:none"><button class="btn btn-gold" onclick="doExport()">↓ Export .xlsx</button></div>
<button class="btn btn-ghost" id="back-vendor-btn" style="display:none" onclick="backToVendors()">← Switch Vendor</button>
</div>
</div>
</div>
<div class="ctn">
<!-- VENDOR SELECTOR -->
<div id="vs-section">
<div class="vs">
<div class="vs-title">Select Vendor</div>
<div class="vs-sub">Choose a vendor to start or resume a session</div>

<!-- Vendor Dropdown -->
<div style="margin-bottom:20px;">
<label style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:8px;">Choose Vendor</label>
<select id="vs-dropdown" style="width:100%;padding:13px 16px;border-radius:10px;border:1.5px solid var(--border2);background:var(--surface);color:var(--text);font-size:15px;font-weight:600;outline:none;cursor:pointer;font-family:'Inter',sans-serif;appearance:none;background-image:url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2214%22 height=%2214%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23888%22 stroke-width=%222%22%3E%3Cpolyline points=%226 9 12 15 18 9%22/%3E%3C/svg%3E');background-repeat:no-repeat;background-position:right 14px center;" onfocus="this.style.borderColor='#D4A843'" onblur="this.style.borderColor='var(--border2)'">
<option value="" disabled selected>— Select a vendor —</option>
</select>
</div>
<button class="btn btn-gold btn-big" style="width:100%;margin-bottom:24px;" onclick="goWithDropdown()">Open Vendor Session →</button>

<!-- Saved sessions -->
<div id="vs-list"></div>

<!-- Add new vendor -->
<div class="vs-divider">or add a new vendor</div>
<div class="vs-new">
<input type="text" class="vs-input" id="vs-new-name" placeholder="Enter new vendor name" onkeydown="if(event.key==='Enter')startNewVendor()"/>
<button class="btn btn-gold btn-big" onclick="startNewVendor()">+ Add & Start</button>
</div>
</div>
</div>
<!-- UPLOAD SECTION -->
<div id="up-section" style="display:none">
<div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;">
<label style="font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;">Vendor</label>
<div style="font-size:16px;font-weight:700;color:var(--text);" id="cur-vendor-name"></div>
</div>
<div class="uploads">
<div class="uz" id="nz" onclick="document.getElementById('ni').click()"><div class="ui">📦</div><div class="ul" id="nl">Netsuite Items</div><div class="us" id="ns2">Drop .xlsx or click · First sheet</div><input type="file" id="ni" accept=".xlsx,.xls,.csv" onchange="hFile(this,'ns')"></div>
<div class="uz" id="sz" onclick="document.getElementById('si').click()"><div class="ui">🏭</div><div class="ul" id="sl">Supplier Catalog</div><div class="us" id="ss2">Drop .xlsx or click · First sheet</div><input type="file" id="si" accept=".xlsx,.xls,.csv" onchange="hFile(this,'sup')"></div>
</div>
<div class="center" id="run-sec" style="display:none"><div class="rtxt" id="rtxt"></div><button class="btn btn-gold btn-big" id="rbtn" onclick="runMatch()">⚙ Run Matching Engine</button></div>
</div>
<!-- RESULTS -->
<div id="res-sec" style="display:none"><div id="sum"></div><div class="dvd"></div><div class="cbar" id="cbar"></div><div class="tbar" id="tbar"></div><div id="rlist"></div><div id="usup"></div></div>
</div>

<script>
/* ═══════════════════════════════════════════════
   SUPABASE — vendor-wise persistence + sync
   ═══════════════════════════════════════════════ */
const SB='https://xrepjbqwstkqfztjxqsq.supabase.co';
const SK='sb_publishable_3HSsDekMnLLNSeFyKyINxQ_-omWhguz';
const TBL='xinfin_data';

function sbKey(v){return 'magn_v_'+v.replace(/[^a-zA-Z0-9]/g,'_').toLowerCase();}

async function sbGet(id){
  try{const r=await fetch(SB+'/rest/v1/'+TBL+'?id=eq.'+encodeURIComponent(id)+'&select=data',{headers:{'apikey':SK,'Authorization':'Bearer '+SK}});if(!r.ok)throw new Error(r.status);const rows=await r.json();return rows&&rows[0]?rows[0].data:null;}catch(e){console.warn('sbGet fail',e);return null;}
}
async function sbSet(id,data){
  try{const r=await fetch(SB+'/rest/v1/'+TBL,{method:'POST',headers:{'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},body:JSON.stringify({id,data})});if(!r.ok)throw new Error(await r.text());}catch(e){console.warn('sbSet fail',e);}
}
async function sbDel(id){
  try{await fetch(SB+'/rest/v1/'+TBL+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{'apikey':SK,'Authorization':'Bearer '+SK}});}catch(e){}
}

function showSync(state){
  const el=document.getElementById('sync-el');
  if(state==='saving')el.innerHTML='<div class="sync-ind sync-ing"><div class="sync-dot" style="background:var(--amber)"></div>Saving…</div>';
  else if(state==='ok')el.innerHTML='<div class="sync-ind sync-ok">✓ Synced</div>';
  else if(state==='err')el.innerHTML='<div class="sync-ind sync-err">⚠ Offline</div>';
  else if(state==='load')el.innerHTML='<div class="sync-ind sync-ing"><div class="sync-dot" style="background:var(--blue)"></div>Loading…</div>';
  else el.innerHTML='';
  if(state==='ok')setTimeout(()=>{const e=document.getElementById('sync-el');if(e&&e.textContent.includes('Synced'))e.innerHTML='';},2500);
}

/* ═══ VENDOR INDEX ═══ */
const PREDEFINED_VENDORS=["KWS","Terrier","ACTEK","Machine and Welding","CODIPRO","KEN FORGING","Yoke","DIVERSIFIED PLASTICS","COLUMBUS MCKINNON","Miller Products"];

async function loadVendorIndex(){
  const d=await sbGet('magn_index');
  return d&&d.vendors?d.vendors:[];
}
async function saveVendorIndex(vendors){
  await sbSet('magn_index',{vendors});
}

function populateDropdown(savedVendors){
  const sel=document.getElementById('vs-dropdown');
  sel.innerHTML='<option value="" disabled selected>— Select a vendor —</option>';
  // Build combined list: predefined + any custom vendors from saved sessions
  const allNames=new Set(PREDEFINED_VENDORS.map(v=>v));
  (savedVendors||[]).forEach(v=>{allNames.add(v.name);});
  const sorted=[...allNames].sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()));
  sorted.forEach(name=>{
    const saved=(savedVendors||[]).find(v=>v.name.toLowerCase()===name.toLowerCase());
    const label=saved?name+' (saved session)':name;
    sel.innerHTML+='<option value="'+esc(name)+'">'+esc(label)+'</option>';
  });
}

function goWithDropdown(){
  const sel=document.getElementById('vs-dropdown');
  const name=sel.value;
  if(!name){sel.focus();sel.style.borderColor='var(--red)';setTimeout(()=>sel.style.borderColor='var(--border2)',1500);return;}
  resumeVendor(name);
}

/* ═══ STATE ═══ */
let vendor='',nsData=null,supData=null,results=null,unmSup=[];
let curTab="all",curConf="all",curSearch="",version=0;
let syncTimer=null;

/* ═══ SAVE FULL SESSION ═══ */
async function saveSession(){
  if(!vendor)return;
  showSync('saving');
  version++;
  const payload={vendor,version,lastModified:new Date().toISOString(),nsData,supData,
    results:results?results.map(r=>({ni:r.ni,ns:r.ns,sup:r.sup,score:r.score,conf:r.conf,sig:r.sig,disc:r.disc,status:r.status,remarks:r.remarks,manual:r.manual||false,_prev:r._prev||null,candidates:r.candidates||[]})):null,
    unmSup:unmSup?unmSup.map(u=>({sup:u.sup,idx:u.idx,cat:u.cat})):[]
  };
  try{await sbSet(sbKey(vendor),payload);showSync('ok');}catch(e){showSync('err');}
}

/* ═══ LOAD SESSION ═══ */
async function loadSession(vendorName){
  showSync('load');
  const d=await sbGet(sbKey(vendorName));
  if(!d){showSync('');return false;}
  vendor=d.vendor||vendorName;
  nsData=d.nsData||null;supData=d.supData||null;
  results=d.results||null;unmSup=d.unmSup||[];version=d.version||0;
  showSync('ok');return true;
}

/* ═══ POLL FOR REMOTE CHANGES (cross-device sync) ═══ */
function startSync(){
  if(syncTimer)clearInterval(syncTimer);
  syncTimer=setInterval(async()=>{
    if(!vendor)return;
    try{
      const d=await sbGet(sbKey(vendor));

        console.log('[MAGN] Remote update detected, reloading... (remote v'+d.version+' > local v'+version+')');

  },12000); // poll every 12 seconds
}

function timeAgo(iso){
  const diff=Date.now()-new Date(iso).getTime();
  const m=Math.floor(diff/60000),h=Math.floor(m/60),d=Math.floor(h/24);
  if(m<1)return 'just now';if(m<60)return m+'m ago';if(h<24)return h+'h ago';return d+'d ago';
}

async function resumeVendor(name){
  showSync('load');

  const vendors=await loadVendorIndex();
  if(!vendors.find(v=>v.name.toLowerCase()===name.toLowerCase())){
    vendors.push({name,lastModified:new Date().toISOString(),nsCount:0,supCount:0,matched:0});

    document.getElementById('nz').classList.add('done');
    document.getElementById('nl').textContent='✓ Loaded from session';

/* ═══ FILE HANDLING ═══ */
function hFile(input,type){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(e){const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});const sn=wb.SheetNames[0];const data=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:""});if(type==='ns'){nsData=data;document.getElementById('nz').classList.add('done');document.getElementById('nl').textContent='✓ '+file.name;document.getElementById('ns2').innerHTML=data.length+' items from <b>'+esc(sn)+'</b>';}else{supData=data;document.getElementById('sz').classList.add('done');document.getElementById('sl').textContent='✓ '+file.name;document.getElementById('ss2').innerHTML=data.length+' items from <b>'+esc(sn)+'</b>';}if(nsData&&supData){document.getElementById('run-sec').style.display='block';document.getElementById('rtxt').innerHTML='Ready: <b>'+nsData.length+'</b> NS × <b>'+supData.length+'</b> Supplier';}};reader.readAsArrayBuffer(file);}

/* ═══ MATCHING ENGINE — STRICT 1:1 ═══ */
const MR=[/\b([A-Z]{1,2}-\d{3}[A-Z]?)\b/g,/\b(\d+[A-Z]\d{3})\b/g,/\bModel\s+([A-Z0-9]+-?[A-Z0-9]+)/gi,/\b(B13L|A13L|BB13L)\b/gi,/\b(PL\d\/\d)\b/gi,/\b(HB\d+[A-Z]?-?\d*[A-Z]*)\b/g,/\b(6[AO]\d+)\b/gi,/\b(12TOHB)\b/gi,/\bType\s+(\d{3})\b/gi];
const CN={"Eye x Eye":"Eye to Eye","E&E":"Eye to Eye","Eye to Eye":"Eye to Eye","Clevis x Clevis":"Jaw to Jaw","J&J":"Jaw to Jaw","C&C":"Jaw to Jaw","Jaw to Jaw":"Jaw to Jaw","Clevis x Eye":"Jaw to Eye","J&E":"Jaw to Eye","Jaw to Eye":"Jaw to Eye","Eye to Jaw":"Eye to Jaw","Eye x Clevis":"Eye to Jaw","E&C":"Eye to Jaw","E&J":"Eye to Jaw","J&H":"Jaw to Hook","Jaw to Hook":"Jaw to Hook","E&H":"Eye to Hook","Eye to Hook":"Eye to Hook","BN&BN":"Bullet to Bullet","Bullet Nose":"Bullet to Bullet","Bullet to Bullet":"Bullet to Bullet","S&H":"Socket to Hook","Socket to Hook":"Socket to Hook","Wedge to Hook":"Wedge to Hook","Wedge to Jaw":"Wedge to Jaw","Thimble to Jaw":"Thimble to Jaw","Thimble to Eye":"Thimble to Eye","Thimble to Bullet":"Thimble to Bullet"};
const ST=new Set(['nan','the','and','for','with','miller','products','swivel']);
function xM(t){if(!t)return[];t=String(t);const s=new Set();MR.forEach(p=>{const r=new RegExp(p.source,p.flags);let m;while((m=r.exec(t))!==null)s.add(m[1].toUpperCase().replace(/\s+/g,""));});return[...s];}
function xT(t){if(!t)return null;t=String(t);for(const p of[/(\d+\.?\d*)\s*[Tt]on/gi,/WLL[:\s]*(\d+\.?\d*)\s*[Tt]/gi,/WLL[:\s]*(\d[\d,]*)\s*lbs/gi,/Working\s+Load[:\s]*(\d[\d,]*)\s*lbs/gi]){const r=new RegExp(p.source,p.flags);const m=r.exec(t);if(m){let v=parseFloat(m[1].replace(/,/g,""));if(v>100)v/=2000;return v;}}return null;}
function xC(t){if(!t)return null;t=String(t);for(const[k,v]of Object.entries(CN))if(t.includes(k))return v;return null;}
function xCat(t){if(!t)return null;const u=String(t).toUpperCase();if(u.includes("HEADACHE")||u.includes("OVERHAUL BALL")||u.includes("SPLIT BALL"))return"HB";if(u.includes("SWIVEL")||u.includes("PULLING"))return"SW";if(u.includes("INSULATOR")||u.includes("INSU-LINE")||u.includes("ISO"))return"INS";if(u.includes("LATCH"))return"LT";if(u.includes("WRECKING")||u.includes("DEMOLITION"))return"WR";if(u.includes("HOOK")&&!u.includes("SWIVEL"))return"HK";return"OT";}
function tok(t){if(!t)return new Set();const s=new Set();String(t).toLowerCase().replace(/[^a-z0-9]/g," ").split(/\s+/).forEach(w=>{if(w.length>1&&!ST.has(w))s.add(w);});return s;}
function jac(a,b){if(!a.size||!b.size)return 0;let i=0;a.forEach(x=>{if(b.has(x))i++});return i/(a.size+b.size-i);}
function ntx(r){return["Display Name","Long Description","Item Name/Number","SKU","Vendor's Item Code"].map(c=>{const v=r[c];return(v!=null&&String(v).trim()!==''&&String(v)!=='nan'&&String(v)!=='-')?String(v):'';}).filter(Boolean).join(" ");}
function stx(r){return["Item Name","Marketing Description","Manufacturer Part Number"].map(c=>{const v=r[c];return(v!=null&&String(v).trim()!==''&&String(v)!=='nan')?String(v):'';}).filter(Boolean).join(" ");}

function matchAll(){
  // Step 1: Preprocess all items
  const np=nsData.map((n,i)=>{const t=ntx(n);return{i,m:xM(t),ton:xT(t),con:xC(t),cat:xCat(t),tok:tok(t),wt:parseFloat(n["Weight"])||0};});
  const sp=supData.map((s,i)=>{const t=stx(s);return{i,m:xM(t),ton:xT(t),con:xC(t),cat:xCat(t),tok:tok(t),wt:parseFloat(s["Weight (LBS)"])||0};});

  // Step 2: For EACH NS item, compute ALL candidates with score >= 15
  const allCands={};// keyed by NS index
  for(let i=0;i<nsData.length;i++){
    const n=np[i]; const cands=[];
    for(const s of sp){
      let sc=0;const sig=[];
      const mo=n.m.filter(m=>s.m.includes(m));if(mo.length){sc+=50;sig.push("Model: "+mo.join(", "));}
      if(n.ton&&s.ton&&Math.abs(n.ton-s.ton)<0.01){sc+=15;sig.push("Tonnage: "+n.ton+"T");}
      if(n.con&&s.con&&n.con===s.con){sc+=15;sig.push("Connection: "+n.con);}
      if(n.cat&&s.cat&&n.cat===s.cat){sc+=10;sig.push("Category: "+n.cat);}
      const ds=jac(n.tok,s.tok);sc+=ds*20;if(ds>0.15)sig.push("Desc: "+(ds*100).toFixed(0)+"%");
      if(n.wt>0&&s.wt>0&&Math.abs(n.wt-s.wt)/Math.max(n.wt,s.wt)<0.1){sc+=5;sig.push("Wt match");}
      if(sc>=15)cands.push({si:s.i,score:sc,sig});
    }
    cands.sort((a,b)=>b.score-a.score);
    allCands[i]=cands;
  }

  // Step 3: Collect all auto-match eligible pairs (best>=70, gap to 2nd >=40)
  const autoEligible=[];// {ni, si, score, sig}
  for(let i=0;i<nsData.length;i++){
    const cands=allCands[i];
    if(!cands.length)continue;
    const best=cands[0]; const secondBest=cands[1];
    const gap=secondBest?(best.score-secondBest.score):999;
    if(best.score>=70 && gap>=40){
      autoEligible.push({ni:i,si:best.si,score:best.score,sig:best.sig});
    }
  }

  // Step 4: Greedy 1:1 assignment — highest score first, no supplier used twice
  autoEligible.sort((a,b)=>b.score-a.score);
  const claimedSup=new Set();// supplier indices already auto-matched
  const claimedNS=new Set();// NS indices already auto-matched
  const autoMatches={};// ni -> {si, score, sig}

  for(const ae of autoEligible){
    if(claimedSup.has(ae.si)||claimedNS.has(ae.ni))continue;
    autoMatches[ae.ni]=ae;
    claimedSup.add(ae.si);
    claimedNS.add(ae.ni);
  }

  // Step 5: Build results array
  const res=[];
  for(let i=0;i<nsData.length;i++){
    const cands=allCands[i];
    const am=autoMatches[i];
    if(am){
      // Auto-matched (1:1 verified)
      const sup=supData[am.si]; const disc=[];
      const nw=parseFloat(nsData[i]["Weight"])||0,sw=parseFloat(sup["Weight (LBS)"])||0;
      if(nw>0&&sw>0&&Math.abs(nw-sw)/Math.max(nw,sw)>0.1)disc.push("Wt: NS="+nw+" vs SUP="+sw);
      res.push({ns:nsData[i],ni:i,sup:{...sup,_i:am.si},score:am.score,conf:"high",sig:am.sig,disc,
        status:"matched",candidates:cands,remarks:"Auto-matched",manual:false,_prev:null});
    } else if(cands.length>0){
      res.push({ns:nsData[i],ni:i,sup:null,score:0,conf:"none",sig:[],disc:[],
        status:"review",candidates:cands,remarks:"",manual:false,_prev:null});
    } else {
      res.push({ns:nsData[i],ni:i,sup:null,score:0,conf:"none",sig:[],disc:[],
        status:"unmatched",candidates:[],remarks:"",manual:false,_prev:null});
    }
  }

  // Step 6: Verify counts (debug safety net)
  const matchedSupIds=new Set(res.filter(r=>r.status==="matched"&&r.sup).map(r=>r.sup._i));
  console.log('[MAGN] Auto-matched:',matchedSupIds.size,'unique suppliers from',res.filter(r=>r.status==="matched").length,'matched NS items');
  if(matchedSupIds.size!==res.filter(r=>r.status==="matched").length){
    console.error('[MAGN] 1:1 VIOLATION DETECTED! Matched NS:',res.filter(r=>r.status==="matched").length,'Unique sup:',matchedSupIds.size);
  }

  recalcUnmSup();
  return res;
}

/* Helper: get set of all currently matched supplier indices */
function getMatchedSupSet(){
  const s=new Set();
  if(!results)return s;
  results.forEach(r=>{if(r.status==="matched"&&r.sup&&r.sup._i!=null)s.add(r.sup._i);});
  return s;
}
/* Find which NS item a supplier is matched to */
function getMatchedToNS(si){
  if(!results)return null;
  const r=results.find(x=>x.status==="matched"&&x.sup&&x.sup._i===si);
  return r?r:null;
}

function recalcUnmSup(){
  const ms=getMatchedSupSet();
  unmSup=supData.map((s,i)=>({sup:s,idx:i,cat:xCat(stx(s))})).filter(s=>!ms.has(s.idx));
}

async function runMatch(){
  const b=document.getElementById('rbtn');b.disabled=true;b.textContent='⏳ Processing...';
  setTimeout(async()=>{
    results=matchAll();
    const vendors=await loadVendorIndex();
    const vi=vendors.find(v=>v.name.toLowerCase()===vendor.toLowerCase());
    if(vi){vi.lastModified=new Date().toISOString();vi.nsCount=nsData.length;vi.supCount=supData.length;vi.matched=results.filter(r=>r.status==="matched").length;}
    await saveVendorIndex(vendors);
    await saveSession();
    showResultsView();
    startSync();
    b.disabled=false;b.textContent='⚙ Run Matching Engine';
  },50);
}

/* ═══ ACTIONS ═══ */
function confirmMatch(ni,si){
  // Match NS item ni to supplier si
  const ms=getMatchedSupSet();
  if(ms.has(si)){
    const owner=getMatchedToNS(si);
    if(owner)alert('This supplier item is already matched to NS item #'+(owner.ni+1)+': '+(owner.ns["Display Name"]||owner.ns["Item Name/Number"])+'. Unmatch it there first.');
    return;
  }
  const r=results[ni]; const sup=supData[si];
  const cand=r.candidates.find(c=>c.si===si);
  const disc=[];
  const nw=parseFloat(r.ns["Weight"])||0,sw=parseFloat(sup["Weight (LBS)"])||0;
  if(nw>0&&sw>0&&Math.abs(nw-sw)/Math.max(nw,sw)>0.1)disc.push("Wt: NS="+nw+" vs SUP="+sw);
  r.sup={...sup,_i:si};r.score=cand?cand.score:100;r.conf=r.score>=65?"high":r.score>=40?"medium":"low";
  r.sig=cand?cand.sig:["Manual match"];r.disc=disc;r.status="matched";r.manual=true;r.remarks="User confirmed";r._prev=null;
  recalcUnmSup();renderAll();saveSession();
}

function manualMatchFromPicker(si,ni){
  const ms=getMatchedSupSet();
  if(ms.has(si)){
    const owner=getMatchedToNS(si);
    if(owner)alert('Already matched to NS #'+(owner.ni+1)+': '+(owner.ns["Display Name"]||owner.ns["Item Name/Number"]));
    return;
  }
  const r=results[ni]; const sup=supData[si]; const disc=[];
  const nw=parseFloat(r.ns["Weight"])||0,sw=parseFloat(sup["Weight (LBS)"])||0;
  if(nw>0&&sw>0&&Math.abs(nw-sw)/Math.max(nw,sw)>0.1)disc.push("Wt: NS="+nw+" vs SUP="+sw);
  r._prev=null;r.sup={...sup,_i:si};r.score=100;r.conf="high";r.sig=["Manual match"];r.disc=disc;
  r.status="matched";r.manual=true;r.remarks="Matched - Manual";
  recalcUnmSup();renderAll();saveSession();
}

function unM(ni){
  const r=results[ni];
  r._prev={sup:r.sup?JSON.parse(JSON.stringify(r.sup)):null,score:r.score,conf:r.conf,sig:[...r.sig],disc:[...r.disc],remarks:r.remarks};
  r.sup=null;r.score=0;r.sig=[];r.disc=[];r.manual=true;r.remarks="Manually unmatched";
  // Send to review if has candidates, otherwise unmatched
  r.status=(r.candidates&&r.candidates.length>0)?"review":"unmatched";
  r.conf="none";
  recalcUnmSup();renderAll();saveSession();
}

function restoreMatch(ni){
  const r=results[ni];if(!r._prev||!r._prev.sup)return;
  // Check if supplier is still free
  const si=r._prev.sup._i;
  const ms=getMatchedSupSet();
  if(ms.has(si)){
    const owner=getMatchedToNS(si);
    if(owner)alert('Cannot restore — supplier now matched to NS #'+(owner.ni+1)+': '+(owner.ns["Display Name"]||owner.ns["Item Name/Number"]));
    return;
  }
  r.sup=r._prev.sup;r.score=r._prev.score;r.conf=r._prev.conf;r.sig=r._prev.sig;r.disc=r._prev.disc;r.remarks=r._prev.remarks;r.status="matched";r.manual=false;r._prev=null;
  recalcUnmSup();renderAll();saveSession();
}

function markNoMatch(ni){
  const r=results[ni];
  r.sup=null;r.status="unmatched";r.conf="none";r.score=0;r.sig=[];r.disc=[];r.manual=true;r.remarks="No match (user confirmed)";
  recalcUnmSup();renderAll();saveSession();
}

/* ═══ RENDERING ═══ */
function renderAll(){
  // Preserve search state before re-rendering toolbar
  const searchEl=document.getElementById('m-search');
  const hadFocus=searchEl&&document.activeElement===searchEl;
  const cursorPos=hadFocus?searchEl.selectionStart:0;
  if(searchEl)curSearch=searchEl.value;// sync in case oninput didn't fire

  renderSum();renderConf();renderTbar();renderList();renderUnm();

  // Restore focus if user was typing
  if(hadFocus){
    const newEl=document.getElementById('m-search');
    if(newEl){newEl.focus();newEl.setSelectionRange(cursorPos,cursorPos);}
  }
}

function renderSum(){
  // Always recalculate unmSup from current matched state to ensure accuracy
  recalcUnmSup();
  const m=results.filter(r=>r.status==="matched").length,rv=results.filter(r=>r.status==="review").length;
  const un=results.filter(r=>r.status==="unmatched").length;
  const t=results.length;
  const d=results.filter(r=>r.status==="matched"&&r.disc.length>0).length;
  // Validate: matched + review + unmatched must equal total NS
  const nsCheck=m+rv+un;
  // Validate: matched unique suppliers + unmSup must equal total supplier
  const supCheck=(getMatchedSupSet().size)+unmSup.length;
  const nsOk=nsCheck===t;
  const supOk=supCheck===supData.length;
  document.getElementById('sum').innerHTML='<div class="sgrid">'+
    sC("Netsuite",t,"Input","sn")+sC("Supplier",supData.length,"Catalog","sn")+
    sC("Matched",m,(m/t*100).toFixed(0)+"% confirmed","sg")+
    sC("Review",rv,"Need your input","sy")+
    sC("Unmatched NS",un,"No candidates","sr")+
    sC("Unmatched Sup",unmSup.length,(100-getMatchedSupSet().size/supData.length*100).toFixed(0)+"% of Sup","so")+
    '</div>'+
    (!nsOk?'<div style="background:var(--red-l);border:1px solid rgba(220,38,38,0.2);border-radius:8px;padding:8px 14px;margin-bottom:12px;font-size:12px;color:var(--red);">⚠ NS count error: '+m+'+'+rv+'+'+un+'='+nsCheck+' ≠ '+t+'</div>':'')+
    (!supOk?'<div style="background:var(--red-l);border:1px solid rgba(220,38,38,0.2);border-radius:8px;padding:8px 14px;margin-bottom:12px;font-size:12px;color:var(--red);">⚠ Supplier count error: '+getMatchedSupSet().size+' matched + '+unmSup.length+' unmatched = '+(getMatchedSupSet().size+unmSup.length)+' ≠ '+supData.length+'</div>':'');
}
function sC(l,v,s,c){const cm={"sg":"var(--green)","sr":"var(--red)","so":"var(--orange)","sy":"var(--amber)","sn":"var(--brand)"};return'<div class="sc '+c+'"><div class="scl">'+l+'</div><div class="scv" style="color:'+cm[c]+'">'+v+'</div><div class="scs">'+s+'</div></div>';}

function renderConf(){
  const m=results.filter(r=>r.status==="matched").length,rv=results.filter(r=>r.status==="review").length;
  const un=results.filter(r=>r.status==="unmatched").length;
  document.getElementById('cbar').innerHTML=
    '<div class="ci"><div class="cd ch"></div><div class="ct">Matched<b>'+m+'</b></div></div>'+
    '<div class="ci"><div class="cd cm"></div><div class="ct">Review<b>'+rv+'</b></div></div>'+
    '<div class="ci"><div class="cd cn"></div><div class="ct">Unmatched<b>'+un+'</b></div></div>'+
    (rv>0?'<span style="margin-left:auto;font-size:12px;color:var(--amber);font-weight:600;">⚠ '+rv+' items need your review</span>':'<span style="margin-left:auto;font-size:12px;color:var(--green);font-weight:600;">✓ All items reviewed</span>');
}

function renderTbar(){
  const m=results.filter(r=>r.status==="matched").length;
  const rv=results.filter(r=>r.status==="review").length;
  const un=results.filter(r=>r.status==="unmatched").length;
  const hasFilters=curSearch||curConf!=="all";
  document.getElementById('tbar').innerHTML=
    tB("all","All ("+results.length+")")+
    tB("matched","✓ Matched ("+m+")")+
    tB("review","⚡ Review ("+rv+")")+
    tB("unmatched","✕ Unmatched ("+un+")")+
    tB("unmatchedsup","Unmatched Sup ("+unmSup.length+")")+
    '<div class="spacer"></div>'+
    '<input type="search" id="m-search" placeholder="Search..." value="'+esc(curSearch)+'" oninput="doSearch(this.value)" onsearch="doSearch(this.value)">'+
    '<button class="btn" id="m-clear-btn" style="background:var(--red-l);color:var(--red);border:1px solid rgba(220,38,38,0.2);font-size:11px;padding:6px 14px;display:'+(hasFilters?'inline-flex':'none')+';" onclick="clearAllFilters()">✕ Clear</button>'+
    '<button class="btn btn-ghost" onclick="reUpload()">↑ Re-upload Files</button>';
}
function tB(k,l){return'<button class="tab'+(curTab===k?' act':'')+'" onclick="switchTab(\''+k+'\')">'+l+'</button>';}

function switchTab(tab){
  curTab=tab;
  // Don't clear search when switching tabs — let user search across tabs
  renderTbar();
  renderList();
}

function doSearch(val){
  const prev=curSearch;
  curSearch=val||"";
  // Update clear button
  const clearBtn=document.getElementById('m-clear-btn');
  if(clearBtn)clearBtn.style.display=(curSearch||curConf!=="all")?'inline-flex':'none';
  // If search was cleared (had text → now empty), do full render to restore everything
  if(prev&&!curSearch){
    renderList();
    renderUnm();
  } else {
    renderList();
  }
}

function clearAllFilters(){
  curSearch="";
  curConf="all";
  const el=document.getElementById('m-search');
  if(el)el.value="";
  // Full re-render to restore everything
  renderTbar();
  renderList();
  renderUnm();
}

function fR(){
  let r=results;
  if(curTab==="matched")r=r.filter(x=>x.status==="matched");
  else if(curTab==="review")r=r.filter(x=>x.status==="review");
  else if(curTab==="unmatched")r=r.filter(x=>x.status==="unmatched");
  else if(curTab==="unmatchedsup")return[];
  if(curSearch){const q=curSearch.toLowerCase();r=r.filter(x=>[x.ns["Display Name"],x.ns["Item Name/Number"],x.ns["SKU"],x.sup?.["Item Name"],x.sup?.["Manufacturer Part Number"]].some(v=>String(v||"").toLowerCase().includes(q)));}
  return r;
}

function renderList(){
  if(curTab==="unmatchedsup"){rUS();return;}
  document.getElementById('usup').innerHTML='';
  const f=fR();
  if(!f.length){document.getElementById('rlist').innerHTML='<div class="empty">'+(curTab==="review"?"All items have been reviewed — great job!":"No items match current filters")+'</div>';return;}
  if(curTab==="review"||curTab==="all"){
    document.getElementById('rlist').innerHTML=f.map(r=>r.status==="review"?rReviewRow(r):r.status==="matched"?rMatchedRow(r):rUnmatchedRow(r)).join("");
  } else if(curTab==="matched"){
    document.getElementById('rlist').innerHTML=f.map(rMatchedRow).join("");
  } else if(curTab==="unmatched"){
    document.getElementById('rlist').innerHTML=f.map(rUnmatchedRow).join("");
  } else {
    document.getElementById('rlist').innerHTML=f.map(r=>r.status==="review"?rReviewRow(r):r.status==="matched"?rMatchedRow(r):rUnmatchedRow(r)).join("");
  }
}

  const ns=r.ns;

/* ═══ UNMATCHED SUPPLIER TAB ═══ */

/* ═══ SHARED HELPERS ═══ */
function rPI(ni,items){
  const ms=getMatchedSupSet();
  return items.map(s=>{
    const si=supData.indexOf(s); const taken=ms.has(si); const owner=taken?getMatchedToNS(si):null;
    return '<div class="pki" style="'+(taken?'opacity:0.5;':'')+'"><div onclick="'+(taken?'':'manualMatchFromPicker('+si+','+ni+')')+'" style="cursor:'+(taken?'not-allowed':'pointer')+'"><b>'+esc(s["Item Name"])+'</b><br><small>'+esc(s["Manufacturer Part Number"])+' · Wt: '+s["Weight (LBS)"]+' lbs</small>'+(taken&&owner?'<br><small style="color:var(--red)">⚠ Already matched to NS #'+(owner.ni+1)+'</small>':'')+'</div></div>';
